[workspace]
resolver = "2"
members = [
    "client",
    "server",
    "shared",
]
default-members = ["client"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
tokio = { version = "=1.36.0", features = ["full"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
bytes = "1.5"
thiserror = "1.0"
parking_lot = "0.12"
dashmap = "5.5"
uuid = { version = "=1.6.1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false

[profile.dev]
overflow-checks = false
[patch.crates-io]
macroquad = { path = "ogre_macroquad" }

